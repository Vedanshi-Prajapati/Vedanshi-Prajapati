<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="I design. I build. I ship."><defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.5" stop-color="#2A1065"/>
      <stop offset="1" stop-color="#1B1042"/>
    </linearGradient>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E9D5FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .fl { animation:fsweep 5s ease-in-out infinite; }
    @keyframes fsweep { 0% { transform:translateX(-400px); } 70%,100% { transform:translateX(1200px); } }
    .ft { animation:fbreathe 5s ease-in-out infinite; }
    @keyframes fbreathe { 0%,100% { opacity:0.85; } 50% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="1200" height="110" fill="url(#fbg)"/>
  <rect width="1200" height="110" fill="url(#fgrid)"/>
  <rect width="1200" height="3" fill="#A78BFA" fill-opacity="0.6"/>
  <rect class="fl" x="0" y="0" width="400" height="3" fill="url(#fshine)"/>
  <g class="ft">
    <text x="600" y="55" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">I design. I build. I ship.</text>
    <text x="600" y="86" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#DDD6FE" letter-spacing="2">VEDANSHI PRAJAPATI</text>
  </g>
</svg>