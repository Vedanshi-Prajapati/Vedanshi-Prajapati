  <text class="q" x="350" y="57" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.5">I design<tspan class="m">.</tspan> I build<tspan class="m">.</tspan> I ship<tspan class="m">.</tspan></text>
